name: build_windows

on:
  workflow_dispatch:
  push:
    branches: [ master, integration ]
  pull_request:
    branches: [ master, integration ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      # libzip needs zlib unconditionally and zstd because we enable ENABLE_ZSTD.
      # neither ships with the windows runner, so pull them from vcpkg.
      - name: vcpkg build
        uses: johnwason/vcpkg-action@v4
        id: vcpkg
        with:
          pkgs: zlib zstd
          triplet: x64-windows-release
          token: ${{ github.token }}

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          # set sdk-version
          #vulkan_version: 1.4.341.1
          
          # optional_components: com.lunarg.vulkan.vma
          # install_runtime: true
          cache: true
          stripdown: true

          # You can install a software rasterizer.
          # install_swiftshader: true
          # install_lavapipe: true

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_MANIFEST_MODE=OFF

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vierkant_ed_win_x64
          path: |
            ${{github.workspace}}/build/tools/${{env.BUILD_TYPE}}
            !${{github.workspace}}/build/tools/${{env.BUILD_TYPE}}/*.lib
            !${{github.workspace}}/build/tools/${{env.BUILD_TYPE}}/*.exp

        #     find/configure an external runner with nvidia/gpu support
